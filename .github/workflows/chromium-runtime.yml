name: Verify embedded Chromium runtime
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ChromiumRuntime/**'
      - 'Sources/RadiusEngineABI/**'
      - 'Sources/RadiusApp/Engines/**'
      - 'Sources/RadiusApp/BrowserModel.swift'
      - 'Sources/RadiusApp/AppSmokeTest.swift'
      - 'scripts/chromium-runtime.py'
      - 'scripts/build-app.sh'
      - '.github/workflows/chromium-runtime.yml'
permissions:
  contents: read
concurrency:
  group: radius-chromium-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  embedded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned Chromium SDK
        id: cef-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/radius-cef-runtime
          key: radius-cef154-chrome-2-${{ matrix.arch }}
      - name: Build pinned optional Chromium package
        run: python3 scripts/chromium-runtime.py --arch "${{ matrix.arch }}" --work-dir "$RUNNER_TEMP/radius-cef-runtime"
      - name: Cache verified Chromium SDK
        if: steps.cef-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/radius-cef-runtime
          key: radius-cef154-chrome-2-${{ matrix.arch }}
      - name: Test native shell
        run: ./scripts/test.sh
      - name: Build universal Radius application
        env:
          RADIUS_CHROMIUM_PACKAGE: ${{ runner.temp }}/radius-cef-runtime/Chromium-${{ matrix.arch }}.radiusengine
        run: ./scripts/build-app.sh
      - name: Verify installed Chromium renders inside Radius and quits normally
        timeout-minutes: 10
        env:
          RADIUS_CHROMIUM_WEBSTORE_TEST: "1"
          RADIUS_CHROMIUM_PACKAGE: ${{ runner.temp }}/radius-cef-runtime/Chromium-${{ matrix.arch }}.radiusengine
        run: ./scripts/smoke-app.sh
      - name: Verify Chrome Web Store extension survives process restart
        run: python3 scripts/smoke-chromium-restart.py
      - name: Package graphical development installer
        run: python3 scripts/package-release.py --development
      - name: Archive development runtime
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/radius-cef-runtime/Chromium-${{ matrix.arch }}.radiusengine" "dist/Chromium-${{ matrix.arch }}.radiusengine.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Radius.app "dist/Radius-Chromium-${{ matrix.arch }}.zip"
      - name: Record native runtime validation
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'radius-cef-runtime' / 'radius-adapter-${{ matrix.arch }}.json'
          evidence = json.loads(path.read_text())
          evidence['radiusEmbeddedRuntimeValidated'] = True
          evidence['chromeExtensions'] = True
          evidence['runtimeStyle'] = 'chrome'
          evidence['testedSource'] = os.environ['GITHUB_SHA']
          evidence['nativeChecks'] = ['HTTP', 'HTTPS', 'reader', 'PNG capture', 'profiles', 'private windows', 'normal/private popup policy and opener', 'Chrome toolbar geometry and focus', 'MV3 lifecycle and APIs', 'extension auxiliary window identity and lifetime', 'Chrome Web Store installation', 'extension persistence after process restart', 'extension removal', 'tab close', 'extension manager open during normal quit']
          path.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Radius-Chromium-${{ matrix.arch }}-development-runtime
          path: |
            dist/*.dmg
            dist/Chromium-*.radiusengine.zip
            dist/Radius-Chromium-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Radius-Chromium-${{ matrix.arch }}-diagnostics
          path: |
            dist/screenshots/*.png
            dist/smoke-*.log
            dist/smoke-sample.txt
            dist/native-tests*.log
            dist/native-tests*.txt
            dist/smoke-data/Chromium/engine.log
            ${{ runner.temp }}/radius-cef-runtime/radius-adapter-*.json
          if-no-files-found: warn
